# Read the Docs builds docs.codeonym.work, the hub of codeonym's project docs, from this file.
# Each project is a Read the Docs subproject, served at /projects/<name>/.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

python:
  install:
    - requirements: requirements.txt

sphinx:
  configuration: docs/conf.py
  builder: dirhtml
  fail_on_warning: true
